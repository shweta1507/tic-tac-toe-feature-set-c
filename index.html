<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Tic-Tac-Toe</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><main class="wrap"><header><div><h1>AI TIC-TAC-TOE</h1><p>Challenge the Computer</p></div><button id="sound">🔊 Sound On</button></header><div class="layout"><section><div id="status" class="status">Your Turn</div><div id="board" class="board"></div><div class="card controls"><h2>Difficulty</h2><div class="levels"><button class="level active" data-level="Easy">🌿 Easy</button><button class="level" data-level="Medium">⚡ Medium</button><button class="level" data-level="Hard">🧠 Hard</button></div><p id="desc">Random moves</p><div class="actions"><button id="replay">↻ Replay</button><button id="new">＋ New Game</button></div></div></section><aside><div class="card"><h2>Scoreboard</h2><div class="scores"><div><b id="wins">0</b><small>🏆 You</small></div><div><b id="losses">0</b><small>🤖 Computer</small></div><div><b id="draws">0</b><small>🤝 Draws</small></div></div></div><div class="card"><div class="historyHead"><h2>Game History</h2><button id="clear">Clear</button></div><div id="history"><p class="empty">No games played yet.</p></div></div></aside></div><footer>Python Flask · Feature Set C</footer></main><script src="{{ url_for('static',filename='script.js') }}"></script></body></html>
